services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: filemate
      POSTGRES_DB: filemate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - filemate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filemate -d filemate"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  filemate_pg:
